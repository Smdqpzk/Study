<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測複習戰情室 & 智能錯題本</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        
        .exam-note {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .exam-note:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.07);
            border-color: #cbd5e1;
        }

        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .drag-over {
            background-color: #e0e7ff !important;
            border: 2px dashed #6366f1 !important;
        }

        button, .interactive-btn { transition: all 0.2s ease; }
        button:active { transform: scale(0.96); }
        
        #drawing-canvas {
            touch-action: none; /* 防止手機瀏覽器預設的捲動與縮放行為 */
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold text-slate-800 tracking-wider flex items-center gap-2">
                <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20 text-xs sm:text-sm">🎯</span> 
                學測複習戰情室
            </h1>
            <div class="flex items-center space-x-2">
                <span id="db-status" class="bg-amber-500 text-white px-3 py-1 rounded-full text-[11px] sm:text-xs font-semibold shadow-sm tracking-wide">連線中...</span>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->

                            </h2>
                            <button onclick="addRootFolder()" class="text-xs bg-slate-900 hover:bg-slate-800 text-white font-bold px-3.5 py-2 rounded-xl transition shadow-sm flex items-center gap-1">
                                <span>+</span> 新增科目

                    <p class="text-[11px] sm:text-xs text-slate-400 mb-4 flex items-center gap-1.5 leading-relaxed">

                    </div>
                </div>
            </section>

            <!-- 右側：每日隨機抽考 -->
            <section class="space-y-6">
                <div class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 p-5 sm:p-7 rounded-3xl text-white shadow-xl shadow-indigo-600/10 relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>

                    <div class="flex justify-between items-center mb-3 sm:mb-4 relative z-10">
                        <h2 class="text-sm sm:text-base font-bold flex items-center gap-2 tracking-wide">
                            <span>💡</span> 每日隨機抽考
                        </h2>

                    <button onclick="filterSubject('全部')" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-slate-900 text-white transition filter-btn shadow-sm shrink-0" data-subject="全部">全部</button>

    <!-- JavaScript 邏輯與即時同步 -->
    <script>
        const SUPABASE_URL = 'https://wtubnxzecdtssrjulevk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NHSv-j6dLVR3CbAR1rjHyQ_5Cig1fAO';
        
        let supabaseClient = null;
        let cards = [];
        let currentFilter = '全部';
        let currentEditingFileId = null;
        let currentEditingDrawingId = null;
        let promptResolve = null;

        // 畫布相關變數
        let canvas, ctx, isDrawing = false;
        let penColor = '#0f172a';
        let penSize = 3;
        let isEraserMode = false;

        function initCanvas() {
            canvas = document.getElementById('drawing-canvas');
            ctx = canvas.getContext('2d');
            
            // 設定實際像素大小以符合顯示大小
            canvas.width = canvas.parentElement.clientWidth || 600;
            canvas.height = 380;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;

            // 滑鼠事件
            canvas.onmousedown = startDraw;
            canvas.onmousemove = draw;
            canvas.onmouseup = stopDraw;
            canvas.onmouseleave = stopDraw;

            // 觸控事件 (手機支援)
            canvas.ontouchstart = (e) => { e.preventDefault(); startDraw(e.touches[0]); };
            canvas.ontouchmove = (e) => { e.preventDefault(); draw(e.touches[0]); };
            canvas.ontouchend = (e) => { e.preventDefault(); stopDraw(); };
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        function setPenColor(color) {
            isEraserMode = false;
            penColor = color;
            ctx.strokeStyle = penColor;
            ctx.globalCompositeOperation = 'source-over';
        }

        function setPenSize(size) {
            penSize = size;
            ctx.lineWidth = penSize;
        }

        function enableEraser() {
            isEraserMode = true;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = penSize * 3;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 填入白色背景防透明
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = penColor;
        }

        function showCustomPrompt(title = "請輸入名稱", placeholder = "請在此輸入...") {
            return new Promise((resolve) => {

        }

        function closeCustomPrompt(isConfirm) {
            const modal = document.getElementById('custom-prompt-modal');
            const input = document.getElementById('custom-prompt-input');

        let treeData = [];

        async function fetchTreeData() {
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                treeData = JSON.parse(localStorage.getItem('study_tree')) || getDefaultTree();
                renderTree(treeData, document.getElementById('tree-container'));
                return;
            }

            const { data, error } = await supabaseClient
                .from('study_trees')
                .select('*')
                .order('sort_order', { ascending: true });

            if (error || !data || data.length === 0) {

        function getDefaultTree() {
            return [
                { id: Date.now() + 1, name: "國文", type: "folder", isOpen: true, children: [
                    { id: Date.now() + 2, name: "古文重點筆記", type: "textfile", content: "【第1冊】勸學..." },
                    { id: Date.now() + 3, name: "字音字形圖解", type: "drawing", content: "" }
                ]}
            ];
        }

        function buildNestedTree(flatList) {
            const map = {};
            const roots = [];
            flatList.forEach(item => {
                map[item.id] = { id: item.id, name: item.name, type: item.type, isOpen: item.is_open, done: item.done, content: item.content, children: [] };
            });
            flatList.forEach(item => {
                if (item.parent_id && map[item.parent_id]) {
                    map[item.parent_id].children.push(map[item.id]);
                } else {
                    roots.push(map[item.id]);
                }
            });
            return roots;
        }

        async function saveAndRenderTree() {
            renderTree(treeData, document.getElementById('tree-container'));
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
            await saveEntireTreeToSupabase();
        }

        async function saveEntireTreeToSupabase() {
            const { data: existing } = await supabaseClient.from('study_trees').select('id');
            if (existing && existing.length > 0) {
                await supabaseClient.from('study_trees').delete().in('id', existing.map(x => x.id));
            }

            const flatList = [];
            let orderCounter = 0;
            const flatten = (nodes, parentId = null) => {
                nodes.forEach(node => {
                    flatList.push({
                        id: node.id,
                        name: node.name,
                        type: node.type,
                        is_open: !!node.isOpen,
                        done: !!node.done,
                        content: node.content || null,
                        parent_id: parentId,
                        sort_order: orderCounter++
                    });
                    if (node.children && node.children.length > 0) {
                        flatten(node.children, node.id);
                    }
                });
            };
            flatten(treeData);
            if (flatList.length > 0) {
                await supabaseClient.from('study_trees').insert(flatList);
            }
        }

        // 拖曳功能
        let draggedNodeId = null;
        function handleDragStart(e, id) { e.stopPropagation(); draggedNodeId = id; }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDragEnter(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

        function handleDrop(e, targetId) {
            e.stopPropagation(); e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (draggedNodeId === null || draggedNodeId === targetId) return;
            let draggedNode = removeNodeFromTree(treeData, draggedNodeId);
            if (!draggedNode) return;

            const insertIntoTarget = (nodes) => {
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].id === targetId) {
                        if (nodes[i].type === 'folder') {
                            if (!nodes[i].children) nodes[i].children = [];
                            nodes[i].children.push(draggedNode);
                            nodes[i].isOpen = true;
                        } else {
                            nodes.splice(i + 1, 0, draggedNode);
                        }
                        return true;
                    }
                    if (nodes[i].children && insertIntoTarget(nodes[i].children)) return true;
                }
                return false;
            };

            if (!insertIntoTarget(treeData)) treeData.push(draggedNode);
            draggedNodeId = null;
            saveAndRenderTree();
        }

        function removeNodeFromTree(nodes, id) {
            for (let i = 0; i < nodes.length; i++) {
                if (nodes[i].id === id) return nodes.splice(i, 1)[0];
                if (nodes[i].children) {
                    let found = removeNodeFromTree(nodes[i].children, id);
                    if (found) return found;
                }
            }
            return null;
        }

                wrapper.addEventListener('dragleave', handleDragLeave);
                wrapper.addEventListener('drop', (e) => handleDrop(e, node.id));
                
                if (node.type === "folder") {
                    const isRoot = depth === 0;
                    wrapper.innerHTML = `
                        <div class="flex items-center justify-between p-2.5 sm:p-3 ${isRoot ? 'bg-white border border-slate-200/80 rounded-2xl shadow-sm' : 'hover:bg-slate-100/70 rounded-xl'} transition-all">

                                <button onclick="addChild(${node.id}, 'textfile')" class="text-[10px] sm:text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-1.5 rounded-xl font-semibold">📄筆記</button>

                        </div>
                    `;
                    if (node.isOpen && node.children && node.children.length > 0) {
                        const childContainer = document.createElement('div');

                        childContainer.className = "space-y-1 mt-1 border-l-2 border-indigo-100 pl-2.5";
                        renderTree(node.children, childContainer, depth + 1);
                        wrapper.appendChild(childContainer);
                    }
                } else if (node.type === "textfile") {
                    wrapper.innerHTML = `
                        <div class="flex items-center justify-between p-2 rounded-xl hover:bg-amber-50/60 border border-transparent hover:border-amber-200/80 transition-all">

                                <span class="text-xs font-semibold text-amber-700 hover:underline">📄 ${node.name}</span>
                            </div>
                            <div class="flex items-center space-x-1" onclick="event.stopPropagation()">
                                <button onclick="openTextModal(${node.id})" class="text-[10px] sm:text-[11px] bg-amber-100/80 text-amber-800 px-2.5 py-1.5 rounded-xl font-medium">編輯</button>
                                <button onclick="deleteNode(${node.id})" class="text-xs text-rose-400 hover:text-rose-600 p-1.5 rounded-xl">刪除</button>
                            </div>
                        </div>
                    `;
                } else if (node.type === "drawing") {
                    wrapper.innerHTML = `
                        <div class="flex items-center justify-between p-2 rounded-xl hover:bg-indigo-50/60 border border-transparent hover:border-indigo-200/80 transition-all">
                            <div onclick="openDrawingModal(${node.id})" class="flex items-center space-x-2 cursor-pointer flex-grow select-none">
                                <span class="text-xs font-semibold text-indigo-700 hover:underline">🎨 ${node.name}</span>

                            <div class="flex items-center space-x-1" onclick="event.stopPropagation()">

                                <button onclick="deleteNode(${node.id})" class="text-xs text-rose-400 hover:text-rose-600 p-1.5 rounded-xl">刪除</button>
                            </div>
                        </div>
                    `;
                } else {
                    wrapper.innerHTML = `
                        <div class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-100/60 border border-transparent hover:border-slate-200/80 transition-all">
                            <label class="flex items-center space-x-2.5 cursor-pointer flex-grow select-none" onclick="event.stopPropagation()">
                                <input type="checkbox" ${node.done ? 'checked' : ''} onchange="toggleItem(${node.id})" class="w-4 h-4 text-indigo-600 rounded border-slate-300">
                                <span class="text-xs font-medium ${node.done ? 'line-through text-slate-400' : 'text-slate-700'}">${node.name}</span>
                            </label>

        function toggleNode(id) {
            const findAndToggle = (nodes) => {
                nodes.forEach(n => {
                    if (n.id === id) n.isOpen = !n.isOpen;
                    else if (n.children) findAndToggle(n.children);
                });
            };
            findAndToggle(treeData);
            saveAndRenderTree();
        }

        async function addChild(parentId, type) {
            let title = type === 'folder' ? "新增子資料夾名稱" : type === 'textfile' ? "新增文字筆記名稱" : type === 'drawing' ? "新增手繪圖解名稱" : "新增複習項目名稱";
            let name = await showCustomPrompt(title, "請輸入...");
            if (!name) return;
            
            const findAndAdd = (nodes) => {
                nodes.forEach(n => {
                    if (n.id === parentId) {
                        if (!n.children) n.children = [];
                        n.children.push({ 
                            id: Date.now(), 
                            name, 
                            type, 
                            isOpen: false, 
                            children: [], 
                            done: false, 
                            content: type === 'textfile' ? '# 筆記內容\n' : (type === 'drawing' ? '' : undefined) 
                        });
                        n.isOpen = true;
                    } else if (n.children) findAndAdd(n.children);
                });
            };
            findAndAdd(treeData);
            saveAndRenderTree();
        }

        function deleteNode(id) {
            if (!confirm("確定要刪除此項目嗎？")) return;
            const findAndDelete = (nodes) => {
                let index = nodes.findIndex(n => n.id === id);
                if (index > -1) { nodes.splice(index, 1); return true; }
                for (let n of nodes) {
                    if (n.children && findAndDelete(n.children)) return true;
                }
                return false;
            };
            findAndDelete(treeData);
            saveAndRenderTree();
        }

        function toggleItem(id) {
            const findAndToggle = (nodes) => {
                nodes.forEach(n => {
                    if (n.id === id) n.done = !n.done;
                    else if (n.children) findAndToggle(n.children);
                });
            };
            findAndToggle(treeData);
            saveAndRenderTree();
        }

                for (let n of nodes) {

            findNode(treeData);

                document.getElementById('modal-title').innerText = `📄 編輯：${targetFile.name}`;
                document.getElementById('modal-file-name').value = targetFile.name;

        function closeTextModal() {
            document.getElementById('textfile-modal').classList.add('hidden');
            currentEditingFileId = null;

        function saveTextModal() {
            if (!currentEditingFileId) return;
            const newName = document.getElementById('modal-file-name').value.trim();
            const newContent = document.getElementById('modal-file-content').value;

        function openDrawingModal(id) {

        // --- 抽考系統 ---
        function loadUserQuiz() {
            const qContainer = document.getElementById('quiz-question');
            const optContainer = document.getElementById('quiz-options');
            const feedback = document.getElementById('quiz-feedback');
            const badge = document.getElementById('quiz-type-badge');
            feedback.classList.add('hidden');

            if (cards.length === 0) {
                qContainer.innerText = "目前題庫尚無題目，請在下方新增錯題！";
                optContainer.innerHTML = '';
                badge.innerText = "等待題庫";
                return;
            }

            const randomCard = cards[Math.floor(Math.random() * cards.length)];
            qContainer.innerText = `[${randomCard.subject}] ${randomCard.question}`;
            optContainer.innerHTML = '';

            const cleanAns = (randomCard.answer || '').replace(/[^A-Ea-e]/g, '').toUpperCase();
            const isMultipleChoice = cleanAns.length > 1;
            badge.innerText = isMultipleChoice ? "多選題" : "單選題";

            let hasOptions = false;
            if (randomCard.options && typeof randomCard.options === 'object') {
                ['A', 'B', 'C', 'D', 'E'].forEach(key => {
                    if (randomCard.options[key]) {
                        hasOptions = true;
                        const btn = document.createElement('button');
                        if (isMultipleChoice) {
                            btn.className = 'quiz-opt-btn w-full text-left text-xs bg-white/10 hover:bg-white/25 text-indigo-50 p-2.5 rounded-xl transition-all font-medium border border-white/15 flex items-center justify-between';
                            btn.dataset.key = key;
                            btn.innerHTML = `<span>(${key}) ${randomCard.options[key]}</span><span class="opt-check text-indigo-200 font-bold bg-white/10 w-5 h-5 rounded flex items-center justify-center">○</span>`;
                            btn.onclick = () => {
                                const checkSpan = btn.querySelector('.opt-check');
                                if (checkSpan.innerText === '○') {
                                    checkSpan.innerText = '✓';
                                    checkSpan.className = 'opt-check text-slate-900 font-bold bg-amber-300 w-5 h-5 rounded flex items-center justify-center';
                                } else {
                                    checkSpan.innerText = '○';
                                    checkSpan.className = 'opt-check text-indigo-200 font-bold bg-white/10 w-5 h-5 rounded flex items-center justify-center';
                                }
                            };
                        } else {
                            btn.className = 'w-full text-left text-xs bg-white/10 hover:bg-white/25 text-indigo-50 p-2.5 rounded-xl transition-all font-medium border border-white/15';
                            btn.innerText = `(${key}) ${randomCard.options[key]}`;
                            btn.onclick = () => checkQuizAnswer(key, randomCard.answer, randomCard.solution, false, false);
                        }
                        optContainer.appendChild(btn);
                    }
                });

                if (isMultipleChoice && hasOptions) {
                    const submitBtn = document.createElement('button');
                    submitBtn.className = 'w-full mt-2 bg-white hover:bg-indigo-50 text-indigo-700 text-xs font-bold py-2.5 rounded-xl transition shadow';
                    submitBtn.innerText = "🚀 送出多選答案";
                    submitBtn.onclick = () => {
                        let selectedKeys = [];
                        document.querySelectorAll('.quiz-opt-btn').forEach(b => {
                            if (b.querySelector('.opt-check').innerText === '✓') selectedKeys.push(b.dataset.key);
                        });
                        checkQuizAnswer(selectedKeys.join(''), randomCard.answer, randomCard.solution, true, false);
                    };
                    optContainer.appendChild(submitBtn);
                }
            }

            if (!hasOptions) {
                badge.innerText = "簡答題";
                optContainer.innerHTML = `<p class="text-xs text-indigo-200">此題為簡答題，請點擊下方查看解析。</p>`;
                const btn = document.createElement('button');
                btn.className = 'w-full text-xs bg-white text-indigo-700 p-2.5 rounded-xl font-bold mt-1 shadow';
                btn.innerText = "💡 查看答案與解析";
                btn.onclick = () => checkQuizAnswer('', randomCard.answer, randomCard.solution, false, true);
                optContainer.appendChild(btn);
            }
        }

        function checkQuizAnswer(selectedAnswer, correctAnswer, solution, isMultiple = false, isNonChoice = false) {
            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');
            const correct = (correctAnswer || '').replace(/[^A-Ea-e]/g, '').toUpperCase().split('').sort().join('');
            const selected = (selectedAnswer || '').replace(/[^A-Ea-e]/g, '').toUpperCase().split('').sort().join('');

            if (isNonChoice) {
                feedback.className = "text-xs font-bold text-white mt-2.5 p-3 rounded-2xl bg-white/20 border border-white/30 backdrop-blur-md space-y-1";
                feedback.innerHTML = `📌 <strong>答案：</strong> ${correctAnswer}<br>💡 <strong>解析：</strong> ${solution || '無'}`;
                return;
            }

            if (selected === correct) {
                feedback.className = "text-xs font-bold text-emerald-100 mt-2.5 p-3 rounded-2xl bg-emerald-600/50 border border-emerald-400 space-y-1";
                feedback.innerHTML = `🎉 <strong>答對了！</strong> (${correctAnswer})<br>💡 <strong>解析：</strong> ${solution || '無'}`;
            } else {
                feedback.className = "text-xs font-bold text-rose-100 mt-2.5 p-3 rounded-2xl bg-rose-600/50 border border-rose-400 space-y-1";
                feedback.innerHTML = `❌ <strong>答錯囉！</strong> 正確答案是 <strong>(${correctAnswer})</strong><br>💡 <strong>解析：</strong> ${solution || '無'}`;
            }
        }

        // --- 便條紙題庫 CRUD ---
        async function fetchCards() {

                cards = JSON.parse(localStorage.getItem('study_notes_cards')) || [];
                updateUI();
                return;

            const { data, error } = await supabaseClient.from('study_cards').select('*').order('created_at', { ascending: false });

        function updateUI() {
            renderSubjectFilters();
            renderCards();
            loadUserQuiz();
        }

        function renderSubjectFilters() {
            const filterContainer = document.getElementById('subject-filters');
            const subjects = ['全部', ...new Set(cards.map(c => c.subject).filter(Boolean))];
            filterContainer.innerHTML = '';
            subjects.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-2 text-xs font-bold rounded-xl transition filter-btn shadow-sm shrink-0 ${currentFilter === sub ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                btn.innerText = sub;
                btn.onclick = () => filterSubject(sub);
                filterContainer.appendChild(btn);
            });
        }

        function filterSubject(sub) {
            currentFilter = sub;
            renderSubjectFilters();
            renderCards();
        }

        async function saveCard() {
            const editingId = document.getElementById('editing-id').value;
            const subject = document.getElementById('card-subject').value.trim();
            const question = document.getElementById('card-question').value.trim();
            
            if (!subject || !question) {
                alert('請填寫「科目」與「題目內容」！');
                return;
            }

            const cardData = {
                subject: subject,
                title: document.getElementById('card-title').value.trim() || '精選試題',
                question: question,
                options: {
                    A: document.getElementById('opt-a').value.trim(),
                    B: document.getElementById('opt-b').value.trim(),
                    C: document.getElementById('opt-c').value.trim(),
                    D: document.getElementById('opt-d').value.trim(),
                    E: document.getElementById('opt-e').value.trim()
                },
                answer: document.getElementById('card-answer').value.trim(),
                solution: document.getElementById('card-solution').value.trim()
            };

            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                if (editingId) {
                    cards = cards.map(c => c.id == editingId ? { ...c, ...cardData } : c);
                } else {
                    cardData.id = Date.now();
                    cards.unshift(cardData);
                }
                localStorage.setItem('study_notes_cards', JSON.stringify(cards));
                updateUI();
                resetForm();
            } else {
                if (editingId) {
                    await supabaseClient.from('study_cards').update(cardData).eq('id', editingId);
                } else {
                    cardData.id = Date.now();
                    await supabaseClient.from('study_cards').insert([cardData]);
                }
                fetchCards();
                resetForm();
            }
        }

        function editCard(id) {
            const card = cards.find(c => c.id == id);
            if (!card) return;

            document.getElementById('editing-id').value = card.id;
            document.getElementById('card-subject').value = card.subject || '';
            document.getElementById('card-title').value = card.title || '';
            document.getElementById('card-question').value = card.question || '';
            document.getElementById('card-answer').value = card.answer || '';
            document.getElementById('card-solution').value = card.solution || '';

            if (card.options && typeof card.options === 'object') {
                document.getElementById('opt-a').value = card.options.A || '';
                document.getElementById('opt-b').value = card.options.B || '';
                document.getElementById('opt-c').value = card.options.C || '';
                document.getElementById('opt-d').value = card.options.D || '';
                document.getElementById('opt-e').value = card.options.E || '';
            }

            document.getElementById('submit-btn').innerHTML = "<span>💾</span> 儲存修改";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function cancelEdit() { resetForm(); }

        function resetForm() {
            document.getElementById('editing-id').value = '';
            document.getElementById('card-subject').value = '';
            document.getElementById('card-title').value = '';
            document.getElementById('card-question').value = '';
            document.getElementById('opt-a').value = '';
            document.getElementById('opt-b').value = '';
            document.getElementById('opt-c').value = '';
            document.getElementById('opt-d').value = '';
            document.getElementById('opt-e').value = '';
            document.getElementById('card-answer').value = '';
            document.getElementById('card-solution').value = '';
            document.getElementById('submit-btn').innerHTML = "<span>✨</span> 將題目加入便條紙題庫";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        async function deleteCard(id) {
            if (!confirm("確定要刪除這張便條紙嗎？")) return;
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                cards = cards.filter(c => c.id != id);
                localStorage.setItem('study_notes_cards', JSON.stringify(cards));
                updateUI();
            } else {
                await supabaseClient.from('study_cards').delete().eq('id', id);
                fetchCards();
            }
        }

        function renderCards() {
            const wall = document.getElementById('card-wall');
            wall.innerHTML = '';
            const filteredCards = currentFilter === '全部' ? cards : cards.filter(c => c.subject === currentFilter);

            if (filteredCards.length === 0) {
                wall.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-10">目前尚無題目資料！</p>`;
                return;
            }

            filteredCards.forEach(c => {
                let optionsHtml = '';
                if (c.options && typeof c.options === 'object') {
                    let optList = '';
                    ['A', 'B', 'C', 'D', 'E'].forEach(key => {
                        if (c.options[key]) {
                            optList += `<div class="text-xs font-mono text-slate-700 py-0.5 flex items-start"><span class="font-bold text-slate-400 mr-2 bg-slate-100 px-1.5 py-0.5 rounded">(${key})</span><span class="mt-0.5">${c.options[key]}</span></div>`;
                        }
                    });
                    if (optList) optionsHtml = `<div class="mb-3 bg-slate-50 p-3 rounded-2xl border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Options</p>${optList}</div>`;
                }

                const div = document.createElement('div');
                div.className = "exam-note p-5 sm:p-6 rounded-3xl relative flex flex-col justify-between";
                div.innerHTML = `
                    <div>
                        <div class="absolute top-4 right-4 flex items-center space-x-1">
                            <button onclick="editCard('${c.id}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl font-bold">編輯</button>
                            <button onclick="deleteCard('${c.id}')" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1.5 rounded-xl font-bold">✕</button>
                        </div>
                        <div class="flex items-center space-x-2 mb-3 pr-20">
                            <span class="text-[10px] sm:text-[11px] font-bold uppercase bg-slate-900 text-white px-2.5 py-1 rounded-xl">${c.subject}</span>
                            <span class="text-xs text-slate-500 truncate">${c.title}</span>
                        </div>
                        <div class="mb-3">
                            <p class="text-xs font-medium text-slate-800 whitespace-pre-wrap leading-relaxed">${c.question}</p>
                        </div>
                        ${optionsHtml}
                    </div>
                    <div class="mt-2 pt-3 border-t border-slate-100 space-y-2">
                        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <span class="text-[11px] font-bold text-slate-600">📌 答案：</span>
                            <span class="text-xs font-bold text-indigo-600 bg-white px-2.5 py-0.5 rounded-lg border">${c.answer || '未設'}</span>
                        </div>
                        <div>
                            <p class="text-[11px] font-bold text-slate-600 mb-1">💡 解題解析：</p>
                            <p class="text-xs text-slate-600 whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-100">${c.solution || '無解析'}</p>
                        </div>
                    </div>
                `;
                wall.appendChild(div);
            });
        }

        window.onload = function() {
            fetchTreeData();
            fetchCards();
        };
    </script>
</body>
</html>
