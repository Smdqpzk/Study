<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測複習筆記本｜Study Notes</title>
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="學測複習、錯題整理、知識樹與每日隨機抽考工具">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;800&display=swap');

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --ink: #172033;
            --muted: #64748b;
            --line: #e2e8f0;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background:
                radial-gradient(circle at 8% 0%, rgba(99,102,241,.11), transparent 28rem),
                radial-gradient(circle at 92% 8%, rgba(139,92,246,.10), transparent 26rem),
                #f7f8fc;
            color: var(--ink);
        }

        ::selection { background: #6366f1; color: white; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .exam-note {
            position: relative;
            background: rgba(255,255,255,.90);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226,232,240,.9);
            box-shadow: 0 8px 30px rgba(15,23,42,.055);
            transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
        }

        .exam-note::before {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            top: 0;
            height: 3px;
            border-radius: 0 0 999px 999px;
            background: linear-gradient(90deg, #4f46e5, #8b5cf6);
            opacity: .75;
        }

        .exam-note:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 38px rgba(15,23,42,.10);
            border-color: #c7d2fe;
        }

        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }

        .drag-over {
            background: rgba(224,231,255,.65) !important;
            outline: 2px dashed #6366f1 !important;
            outline-offset: 2px;
            border-radius: 14px;
        }

        button, input, textarea, .interactive-btn {
            transition: all .18s ease;
        }

        button:active { transform: scale(.97); }

        button:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 3px solid rgba(99,102,241,.20);
            outline-offset: 2px;
        }

        input:hover, textarea:hover { border-color: #cbd5e1; }

        input:focus, textarea:focus {
            background: #fff;
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 4px rgba(99,102,241,.09);
        }

        .section-card {
            background: rgba(255,255,255,.90);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(15,23,42,.055);
        }

        .hero-glow { box-shadow: 0 18px 50px rgba(79,70,229,.20); }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            background: currentColor;
            box-shadow: 0 0 0 4px rgba(255,255,255,.16);
        }

        #drawing-canvas {
            touch-action: none;
            display: block;
            width: 100%;
            height: 380px;
        }


        /* ===== 高質感彈窗系統 ===== */
        .app-modal {
            animation: modalFade .18s ease-out;
        }
        .app-modal-panel {
            animation: modalPop .22s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes modalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalPop {
            from { opacity: 0; transform: translateY(14px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header {
            position: relative;
            overflow: hidden;
        }
        .modal-header::after {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            right: -55px;
            top: -80px;
            border-radius: 999px;
            background: rgba(255,255,255,.10);
            pointer-events: none;
        }
        .modal-close {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.10);
            color: rgba(255,255,255,.75);
            transition: .18s ease;
        }
        .modal-close:hover {
            background: rgba(255,255,255,.22);
            color: #fff;
            transform: rotate(4deg);
        }
        .modal-footer {
            background: linear-gradient(to top, #f8fafc, #fff);
        }
        .modal-primary {
            box-shadow: 0 8px 20px rgba(79,70,229,.20);
        }
        .category-toolbar {
            background: linear-gradient(135deg, rgba(248,250,252,.95), rgba(241,245,249,.72));
            border: 1px solid #e2e8f0;
        }
        .category-filter {
            border: 1px solid #e2e8f0;
            background: white;
            color: #475569;
            transition: .18s ease;
        }
        .category-filter:hover {
            border-color: #a5b4fc;
            background: #eef2ff;
            color: #4338ca;
            transform: translateY(-1px);
        }
        .category-filter.active {
            border-color: #4f46e5;
            background: linear-gradient(135deg,#4f46e5,#6366f1);
            color: white;
            box-shadow: 0 6px 16px rgba(79,70,229,.18);
        }
        .question-type-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 999px;
            letter-spacing: .02em;
        }
        .question-card-actions button {
            opacity: .75;
        }
        .question-card-actions button:hover {
            opacity: 1;
        }
        .dialog-icon {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #eef2ff;
            color: #4f46e5;
            flex-shrink: 0;
        }


        .canvas-tool, .canvas-size-btn, .canvas-action-btn {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 800;
            transition: .16s ease;
            white-space: nowrap;
        }
        .canvas-tool:hover, .canvas-size-btn:hover, .canvas-action-btn:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4338ca;
            transform: translateY(-1px);
        }

        #canvas-stage-inner.eraser-mode #drawing-canvas {
            cursor: cell;
        }

        .canvas-tool.active {
            background: #4f46e5;
            border-color: #4f46e5;
            color: white;
            box-shadow: 0 5px 14px rgba(79,70,229,.20);
        }
        .canvas-action-btn.danger {
            color: #e11d48;
            background: #fff1f2;
            border-color: #fecdd3;
        }
        .canvas-action-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }
        .canvas-stage {
            position: relative;
        }
        .canvas-grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(#cbd5e1 1px, transparent 1px),
                linear-gradient(90deg, #cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: .28;
            display: none;
        }
        .canvas-grid-overlay.show { display: block; }


        .canvas-workspace {
            height: min(60vh, 760px);
            min-height: 360px;
            overscroll-behavior: contain;
        }
        .canvas-viewport {
            width: max-content;
            height: max-content;
            min-width: 100%;
            min-height: 100%;
            padding: 32px;
        }
        .canvas-stage {
            position: relative;
            width: 1200px;
            height: 700px;
            transform-origin: top left;
        }
        .canvas-stage #drawing-canvas,
        .canvas-stage .canvas-grid-overlay {
            width: 1200px !important;
            height: 700px !important;
        }
        .zoom-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            color: #475569;
            font-weight: 900;
        }
        .zoom-btn:hover {
            background: #eef2ff;
            color: #4338ca;
            border-color: #c7d2fe;
        }
        @media (max-width: 640px) {
            .canvas-workspace { height: 50vh; min-height: 280px; }
            .canvas-viewport { padding: 18px; }
            .canvas-stage { width: 900px; height: 560px; }
            .canvas-stage #drawing-canvas,
            .canvas-stage .canvas-grid-overlay { width: 900px !important; height: 560px !important; }
        }

        @media (max-width: 640px) {
            #drawing-canvas { height: 320px; }
            .exam-note:hover { transform: none; }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="bg-white/75 backdrop-blur-xl border-b border-white/80 sticky top-0 z-40 shadow-[0_4px_24px_rgba(15,23,42,.05)]">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold text-slate-800 tracking-wider flex items-center gap-2">
                <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20 text-xs sm:text-sm">📚</span> 
                學測複習筆記本
            </h1>
            <div class="flex items-center space-x-2">
                <span id="db-status" class="bg-amber-500 text-white px-3 py-1 rounded-full text-[11px] sm:text-xs font-semibold shadow-sm tracking-wide">連線中...</span>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl mx-auto px-3 sm:px-4 py-5 sm:py-8 w-full space-y-6 sm:space-y-8">
        
        <!-- 第一部分：知識管理庫與隨機抽考 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
            
            <!-- 左側：各科複習資料夾、文字檔與畫圖筆記知識庫 -->
            <section class="lg:col-span-2 space-y-6">
                <div class="section-card p-5 sm:p-7 rounded-[28px] border border-white/80">
                    <div class="flex justify-between items-center mb-3 sm:mb-4">
                        <div class="flex items-center space-x-3">
                            <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                                <span class="text-indigo-600">📚</span> 核心科目複習知識庫
                            </h2>
                            <button onclick="addRootFolder()" class="text-xs bg-slate-900 hover:bg-slate-800 text-white font-bold px-3.5 py-2 rounded-xl transition shadow-sm flex items-center gap-1">
                                <span>+</span> 新增科目
                            </button>
                        </div>
                    </div>
                    <p class="text-[11px] sm:text-xs text-slate-400 mb-4 flex items-center gap-1.5 leading-relaxed">
                        <span>💡</span> 提示：支援文字筆記、手繪圖解與資料夾階層，所有異動自動同步至雲端！
                    </p>
                    
                    <!-- 階層式資料夾清單容器 -->
                    <div id="tree-container" class="space-y-2 max-h-[380px] sm:max-h-[420px] overflow-y-auto pr-1 min-h-[140px] p-2.5 sm:p-3 rounded-2xl border-2 border-dashed border-slate-200/60 bg-slate-50/40 transition">
                    </div>
                </div>
            </section>

            <!-- 右側：每日隨機抽考 -->
            <section class="space-y-6">
                <div class="hero-glow bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 p-5 sm:p-7 rounded-[28px] text-white relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>

                    <div class="flex justify-between items-center mb-3 sm:mb-4 relative z-10">
                        <h2 class="text-sm sm:text-base font-bold flex items-center gap-2 tracking-wide">
                            <span>💡</span> 每日隨機抽考
                        </h2>
                        <span id="quiz-type-badge" class="text-[11px] font-bold px-2.5 py-1 rounded-xl bg-white/20 backdrop-blur-md text-white">單選題</span>
                    </div>
                    <div id="quiz-container" class="space-y-3.5 relative z-10">
                        <p id="quiz-question" class="text-xs sm:text-sm font-medium text-indigo-50 leading-relaxed min-h-[44px]">載入題目中...</p>
                        <div id="quiz-options" class="space-y-2"></div>
                        <div id="quiz-feedback" class="text-xs font-bold hidden p-3 rounded-2xl bg-white/15 backdrop-blur-md border border-white/25 shadow-lg"></div>
                        <button onclick="loadUserQuiz()" class="w-full mt-2 bg-white/15 hover:bg-white/25 text-white text-xs font-bold py-3 rounded-2xl transition border border-white/20 shadow-sm flex items-center justify-center gap-1.5">
                            <span>🔄</span> 換一題挑戰
                        </button>
                    </div>
                </div>
            </section>

        </div>

        <!-- 第二部分：各科小檔案與便條紙題庫系統 -->
        <section class="bg-white p-5 sm:p-7 rounded-3xl shadow-sm border border-slate-100/80 space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="text-indigo-600">📖</span> 各科錯題與精選試題小檔案
                </h2>
                <!-- 科目篩選按鈕列 -->
                <div id="subject-filters" class="flex flex-nowrap overflow-x-auto w-full sm:w-auto gap-2 pb-1 sm:pb-0 max-w-full"></div>
            </div>
            
            <!-- 新增 / 修改題目的表單 -->
            <div class="bg-slate-50/80 p-4 sm:p-7 rounded-2xl border border-slate-200/80 grid grid-cols-1 md:grid-cols-2 gap-4 shadow-inner">
                <input type="hidden" id="editing-id" value="">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">科目</label>
                    <input id="card-subject" type="text" placeholder="例如: 數學A、物理、化學" class="w-full p-3 text-xs sm:text-sm border border-slate-200/80 rounded-2xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 flex items-center justify-between">
                            <span>章節 / 題目分類</span>
                            <span class="text-[10px] text-indigo-500 font-semibold">建議填：函數、力學、古文…</span>
                        </label>
                    <input id="card-title" type="text" placeholder="例如: 向量與空間 / 113學測單選3" class="w-full p-3 text-xs sm:text-sm border border-slate-200/80 rounded-2xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-sm">
                </div>
                <div class="col-span-full">
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">題目內容</label>
                    <textarea id="card-question" placeholder="在此輸入完整的題目敘述..." class="w-full p-3.5 text-xs sm:text-sm border border-slate-200/80 rounded-2xl h-24 sm:h-28 bg-white resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-sm"></textarea>
                </div>
                
                <!-- ABCDE 選項獨立填空區 -->
                <div class="col-span-full space-y-2.5 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <label class="block text-xs font-bold text-slate-600">選擇題選項 (選填)</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div class="flex items-center space-x-2 bg-slate-50/60 p-1.5 rounded-xl border border-slate-100">
                            <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-lg">A</span>
                            <input id="opt-a" type="text" placeholder="選項 (A)" class="w-full p-2 text-xs border border-slate-200/60 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-50/60 p-1.5 rounded-xl border border-slate-100">
                            <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-lg">B</span>
                            <input id="opt-b" type="text" placeholder="選項 (B)" class="w-full p-2 text-xs border border-slate-200/60 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-50/60 p-1.5 rounded-xl border border-slate-100">
                            <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-lg">C</span>
                            <input id="opt-c" type="text" placeholder="選項 (C)" class="w-full p-2 text-xs border border-slate-200/60 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-50/60 p-1.5 rounded-xl border border-slate-100">
                            <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-lg">D</span>
                            <input id="opt-d" type="text" placeholder="選項 (D)" class="w-full p-2 text-xs border border-slate-200/60 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-50/60 p-1.5 rounded-xl border border-slate-100 sm:col-span-2">
                            <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-lg">E</span>
                            <input id="opt-e" type="text" placeholder="選項 (E) (選填)" class="w-full p-2 text-xs border border-slate-200/60 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- 正確解答設定 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">正確答案 (支援 A 或多選 AB)</label>
                    <input id="card-answer" type="text" placeholder="例如: A 或 AB" class="w-full p-3 text-xs sm:text-sm border border-slate-200/80 rounded-2xl bg-white font-bold text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-sm">
                </div>

                <div class="col-span-full">
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">解題思路與計算過程</label>
                    <textarea id="card-solution" placeholder="記錄突破口、關鍵公式、計算步驟..." class="w-full p-3.5 text-xs sm:text-sm border border-slate-200/80 rounded-2xl h-24 sm:h-32 bg-white resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-sm"></textarea>
                </div>
                
                <div class="col-span-full flex flex-col sm:flex-row gap-2.5 pt-1">
                    <button onclick="saveCard()" id="submit-btn" class="w-full sm:flex-grow bg-slate-900 text-white py-3.5 rounded-2xl font-bold hover:bg-slate-800 transition text-xs sm:text-sm shadow-md flex items-center justify-center gap-1.5">
                        <span>✨</span> 將題目加入便條紙題庫
                    </button>
                    <button onclick="cancelEdit()" id="cancel-btn" class="hidden w-full sm:w-auto bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3.5 rounded-2xl font-bold transition text-xs sm:text-sm">取消修改</button>
                </div>
            </div>

            <!-- 便條紙題庫牆 -->
            <div id="card-wall" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 pt-2">
            </div>
        </section>

    </main>

    <!-- 文字檔編輯 Modal 視窗 -->
    <div id="textfile-modal" class="app-modal fixed inset-0 bg-slate-950/55 backdrop-blur-md z-50 flex items-center justify-center hidden p-2 sm:p-4">
        <div class="app-modal-panel bg-white rounded-[28px] shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col h-[90vh] sm:h-auto sm:max-h-[90vh] border border-white/70">
            <div class="modal-header bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white px-5 sm:px-7 py-5 flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-slate-300 font-bold tracking-[.18em] uppercase mb-1">Study Notes</p>
                    <h3 id="modal-title" class="font-bold text-sm sm:text-base flex items-center gap-2">📄 編輯文字筆記</h3>
                </div>
                <button onclick="closeTextModal()" class="modal-close">✕</button>
            </div>
            <div class="p-4 sm:p-7 flex-grow flex flex-col space-y-4 overflow-y-auto">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">文字檔標題名稱</label>
                    <input id="modal-file-name" type="text" class="w-full p-3 text-xs sm:text-sm border border-slate-200 rounded-2xl bg-slate-50 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
                <div class="flex-grow flex flex-col">
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">詳細內容</label>
                    <textarea id="modal-file-content" placeholder="在此輸入或貼上詳細的筆記內容..." class="w-full h-64 sm:h-80 p-3.5 text-xs sm:text-sm border border-slate-200 rounded-2xl bg-slate-50 font-mono resize-none focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                </div>
            </div>

    <!-- JavaScript 邏輯與即時同步 -->
    <script>
        const SUPABASE_URL = 'https://wtubnxzecdtssrjulevk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NHSv-j6dLVR3CbAR1rjHyQ_5Cig1fAO';
        
        let supabaseClient = null;
        let cards = [];
        let currentFilter = '全部';
        let currentEditingFileId = null;
        let currentEditingDrawingId = null;
        let promptResolve = null;

        // ===== 專業畫布系統 =====
        let canvas, ctx, isDrawing = false;
        let penColor = '#0f172a';
        let penSize = 3;
        let isEraserMode = false;
        let drawTool = 'pen';
        let gridVisible = false;
        let canvasZoom = 1;
        let panX = 0, panY = 0, isPanning = false, panStart = null;
        let baseCanvasWidth = 1200;
        let baseCanvasHeight = 700;
        let history = [];
        let historyIndex = -1;
        let shapeStart = null;
        let previewSnapshot = null;

        function canvasSize() {
            return { width: baseCanvasWidth, height: baseCanvasHeight };
        }

        function saveCanvasState() {
            if (!canvas || !ctx) return;
            try {
                const state = ctx.getImageData(0, 0, canvas.width, canvas.height);
                history = history.slice(0, historyIndex + 1);
                history.push(state);
                if (history.length > 30) history.shift();
                historyIndex = history.length - 1;
                updateCanvasHistoryButtons();
            } catch (err) {
                console.warn('無法建立畫布歷史狀態', err);
            }
        }

        function restoreCanvasState(state) {
            if (!canvas || !ctx || !state) return;
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.putImageData(state, 0, 0);
            ctx.restore();
            applyToolStyle();
        }

        function updateCanvasHistoryButtons() {
            const undo = document.querySelector('[onclick="undoCanvas()"]');
            const redo = document.querySelector('[onclick="redoCanvas()"]');
            if (undo) undo.disabled = historyIndex <= 0;
            if (redo) redo.disabled = historyIndex >= history.length - 1;
        }

        function undoCanvas() {
            if (historyIndex <= 0) return;
            historyIndex--;
            restoreCanvasState(history[historyIndex]);
            updateCanvasHistoryButtons();
        }

        function redoCanvas() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            restoreCanvasState(history[historyIndex]);
            updateCanvasHistoryButtons();
        }

        function initCanvas() {
            canvas = document.getElementById('drawing-canvas');
            ctx = canvas.getContext('2d', { alpha: false });

            const mobile = window.innerWidth <= 640;
            baseCanvasWidth = mobile ? 900 : 1200;
            baseCanvasHeight = mobile ? 560 : 700;

            const stage = document.getElementById('canvas-stage-inner');
            stage.style.width = baseCanvasWidth + 'px';
            stage.style.height = baseCanvasHeight + 'px';
            canvas.style.width = baseCanvasWidth + 'px';
            canvas.style.height = baseCanvasHeight + 'px';

            const dpr = Math.max(1, window.devicePixelRatio || 1);
            canvas.width = Math.floor(baseCanvasWidth * dpr);
            canvas.height = Math.floor(baseCanvasHeight * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, baseCanvasWidth, baseCanvasHeight);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            history = [];
            historyIndex = -1;
            shapeStart = null;
            previewSnapshot = null;
            canvasZoom = 1;
            panX = 0;
            panY = 0;
            applyCanvasTransform();
            applyToolStyle();

            canvas.onpointerdown = (e) => {
                e.preventDefault();
                canvas.setPointerCapture?.(e.pointerId);

                if (drawTool === 'pan' || spacePan || e.button === 1 || e.shiftKey) {
                    isPanning = true;
                    panStart = { clientX: e.clientX, clientY: e.clientY, x: panX, y: panY };
                    document.getElementById('canvas-stage-inner')?.classList.add('pan-mode', 'panning');
                    return;
                }

                startDraw(e);
            };

            canvas.onpointermove = (e) => {
                e.preventDefault();

                if (isPanning && panStart) {
                    panX = panStart.x + (e.clientX - panStart.clientX);
                    panY = panStart.y + (e.clientY - panStart.clientY);
                    applyCanvasTransform();
                    return;
                }

                lastPointerPosition = getMousePos(e);
                draw(e);
            };

            canvas.onpointerup = (e) => {
                e.preventDefault();

                if (isPanning) {
                    isPanning = false;
                    panStart = null;
                    document.getElementById('canvas-stage-inner')?.classList.remove('panning');
                    return;
                }

                stopDraw();
            };

            canvas.onpointercancel = () => {
                isPanning = false;
                panStart = null;
                isDrawing = false;
                document.getElementById('canvas-stage-inner')?.classList.remove('panning');
            };

            saveCanvasState();
            updateCanvasHistoryButtons();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / canvasZoom,
                y: (e.clientY - rect.top) / canvasZoom
            };
        }

        function applyCanvasTransform() {
            const stage = document.getElementById('canvas-stage-inner');
            const viewport = document.getElementById('canvas-viewport');
            if (!stage || !viewport) return;

            stage.style.transform =
                `translate(${panX}px, ${panY}px) scale(${canvasZoom})`;

            viewport.style.width = Math.ceil(baseCanvasWidth * canvasZoom + 64 + Math.abs(panX)) + 'px';
            viewport.style.height = Math.ceil(baseCanvasHeight * canvasZoom + 64 + Math.abs(panY)) + 'px';

            const range = document.getElementById('canvas-zoom-range');
            const label = document.getElementById('canvas-zoom-label');
            if (range) range.value = canvasZoom;
            if (label) label.textContent = Math.round(canvasZoom * 100) + '%';
        }

        function applyCanvasZoom() {
            applyCanvasTransform();
        }

        function setCanvasZoom(value) {
            canvasZoom = Math.min(2.5, Math.max(0.5, value));
            applyCanvasTransform();
        }

        function zoomCanvas(delta) {
            setCanvasZoom(Math.round((canvasZoom + delta) * 10) / 10);
        }

        function fitCanvas() {
            const workspace = document.querySelector('.canvas-workspace');
            if (!workspace) return;

            panX = 0;
            panY = 0;
            const availableW = workspace.clientWidth - 64;
            const availableH = workspace.clientHeight - 64;
            const scale = Math.min(
                availableW / baseCanvasWidth,
                availableH / baseCanvasHeight
            );

            setCanvasZoom(Math.max(0.5, Math.min(1, Math.round(scale * 10) / 10)));
        }

        function resetCanvasPosition() {
            panX = 0;
            panY = 0;
            applyCanvasTransform();
        }

        function applyToolStyle() {
            if (!ctx) return;

            if (drawTool === 'pan') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                return;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (drawTool === 'highlighter') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 0.28;
                ctx.strokeStyle = penColor;
                ctx.lineWidth = Math.max(12, penSize * 3);
            } else if (drawTool === 'eraser') {
                // 使用白色筆刷擦除，而不是 destination-out。
                // 原本 destination-out 會把畫布擦成透明，
                // PNG/Canvas 在部分瀏覽器與目前的工作區背景下會顯示成黑色。
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(12, penSize * 3);
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penSize;
            }
        }

        function setDrawTool(tool) {
            drawTool = tool;
            isEraserMode = tool === 'eraser';

            document.querySelectorAll('.canvas-tool').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });

            const stage = document.getElementById('canvas-stage-inner');
            stage?.classList.toggle('pan-mode', tool === 'pan');
            stage?.classList.toggle('eraser-mode', tool === 'eraser');
            applyToolStyle();
        }

        function setPenColor(color) {
            penColor = color;
            isEraserMode = false;
            drawTool = 'pen';
            setDrawTool('pen');
        }

        function setPenSize(size) {
            penSize = size;
            applyToolStyle();
        }

        function enableEraser() {
            setDrawTool('eraser');
        }

        function startDraw(e) {
            if (!canvas || !ctx || drawTool === 'pan') return;

            isDrawing = true;
            const pos = getMousePos(e);
            shapeStart = pos;

            if (['line', 'rect', 'circle'].includes(drawTool)) {
                previewSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                return;
            }

            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x + 0.01, pos.y + 0.01);
            ctx.stroke();
        }

        function drawShapePreview(pos) {
            if (!previewSnapshot || !shapeStart) return;

            ctx.putImageData(previewSnapshot, 0, 0);
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const x = shapeStart.x;
            const y = shapeStart.y;
            const w = pos.x - x;
            const h = pos.y - y;

            if (drawTool === 'line') {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (drawTool === 'rect') {
                ctx.strokeRect(x, y, w, h);
            } else if (drawTool === 'circle') {
                ctx.beginPath();
                ctx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
            applyToolStyle();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);

            if (['line', 'rect', 'circle'].includes(drawTool)) {
                drawShapePreview(pos);
                return;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() {
            if (!isDrawing) return;

            isDrawing = false;

            if (['line', 'rect', 'circle'].includes(drawTool) && shapeStart) {
                const pos = lastPointerPosition || shapeStart;
                drawShapeFinal(pos);
            } else {
                ctx.closePath();
                saveCanvasState();
            }

            shapeStart = null;
            previewSnapshot = null;
            lastPointerPosition = null;
        }

        let lastPointerPosition = null;

        // 重新包裝 pointer move 以記錄形狀終點
        document.addEventListener('pointermove', (e) => {
            if (isDrawing && canvas && e.target === canvas) {
                lastPointerPosition = getMousePos(e);
            }
        }, { passive: true });

        function drawShapeFinal(pos) {
            if (!shapeStart || !canvas) return;

            // 直接從目前預覽狀態畫出最終形狀
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;
            ctx.lineCap = 'round';

            const x = shapeStart.x;
            const y = shapeStart.y;
            const w = pos.x - x;
            const h = pos.y - y;

            if (drawTool === 'line') {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (drawTool === 'rect') {
                ctx.strokeRect(x, y, w, h);
            } else if (drawTool === 'circle') {
                ctx.beginPath();
                ctx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            applyToolStyle();
            saveCanvasState();
        }

        function clearCanvas() {
            if (!ctx || !canvas) return;

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            // 清空後永遠保持白色不透明背景
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            applyToolStyle();
            saveCanvasState();
        }

        function toggleGrid() {
            gridVisible = !gridVisible;
            document.getElementById('canvas-grid-overlay')?.classList.toggle('show', gridVisible);
            document.getElementById('grid-btn')?.classList.toggle('bg-indigo-100', gridVisible);
        }

        let spacePan = false;
        document.addEventListener('keydown', (e) => {
            if (!canvas || document.getElementById('drawing-modal')?.classList.contains('hidden')) return;
            if (e.code === 'Space' && !e.repeat && document.activeElement?.tagName !== 'INPUT') {
                e.preventDefault();
                spacePan = true;
                document.getElementById('canvas-stage-inner')?.classList.add('pan-mode');
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                spacePan = false;
                if (drawTool !== 'pan') {
                    document.getElementById('canvas-stage-inner')?.classList.remove('pan-mode');
                }
            }
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', (e) => {
            if (!canvas || document.getElementById('drawing-modal')?.classList.contains('hidden')) return;

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undoCanvas();
            } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
                e.preventDefault();
                redoCanvas();
            }
        });

        function showDialog({
            title = '提示',
            message = '',
            icon = '✨',
            confirmText = '確定',
            cancelText = '取消',
            danger = false,
            showCancel = false
        } = {}) {
            return new Promise(resolve => {
                const modal = document.getElementById('app-dialog');
                const iconEl = document.getElementById('dialog-icon');
                const titleEl = document.getElementById('dialog-title');
                const msgEl = document.getElementById('dialog-message');
                const okBtn = document.getElementById('dialog-ok');
                const cancelBtn = document.getElementById('dialog-cancel');

                iconEl.textContent = icon;
                iconEl.className = `dialog-icon ${danger ? 'bg-rose-50 text-rose-600' : 'bg-indigo-50 text-indigo-600'}`;
                titleEl.textContent = title;
                msgEl.textContent = message;
                okBtn.textContent = confirmText;
                okBtn.className = `modal-primary px-5 py-2.5 ${danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white text-xs font-bold rounded-xl`;
                cancelBtn.textContent = cancelText;
                cancelBtn.classList.toggle('hidden', !showCancel);

                modal.classList.remove('hidden');

                const finish = value => {
                    modal.classList.add('hidden');
                    okBtn.onclick = null;
                    cancelBtn.onclick = null;
                    resolve(value);
                };

                okBtn.onclick = () => finish(true);
                cancelBtn.onclick = () => finish(false);
            });
        }

        let treeData = [];

        async function fetchTreeData() {
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                const saved = localStorage.getItem('study_tree');
                treeData = saved ? JSON.parse(saved) : getDefaultTree();

        function getDefaultTree() {
            return [
                { id: Date.now() + 1, name: "國文", type: "folder", isOpen: true, children: [

                    { id: Date.now() + 3, name: "字音字形圖解", type: "drawing", content: "" }
                ]}
            ];
        }

        function buildNestedTree(flatList) {
            const map = {};
            const roots = [];
            flatList.forEach(item => {
                map[item.id] = { id: item.id, name: item.name, type: item.type, isOpen: item.is_open, done: item.done, content: item.content, children: [] };
            });
            flatList.forEach(item => {
                if (item.parent_id && map[item.parent_id]) {
                    map[item.parent_id].children.push(map[item.id]);
                } else {
                    roots.push(map[item.id]);
                }
            });
            return roots;
        }

        async function saveAndRenderTree() {
            renderTree(treeData, document.getElementById('tree-container'));
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                localStorage.setItem('study_tree', JSON.stringify(treeData));
                return;
            }
            await saveEntireTreeToSupabase();
        }

        async function saveEntireTreeToSupabase() {
            const { data: existing } = await supabaseClient.from('study_trees').select('id');
            if (existing && existing.length > 0) {
                await supabaseClient.from('study_trees').delete().in('id', existing.map(x => x.id));
            }

            const flatList = [];
            let orderCounter = 0;
            const flatten = (nodes, parentId = null) => {
                nodes.forEach(node => {
                    flatList.push({
                        id: node.id,
                        name: node.name,
                        type: node.type,
                        is_open: !!node.isOpen,
                        done: !!node.done,
                        content: node.content || null,
                        parent_id: parentId,
                        sort_order: orderCounter++
                    });
                    if (node.children && node.children.length > 0) {
                        flatten(node.children, node.id);
                    }
                });
            };
            flatten(treeData);
            if (flatList.length > 0) {
                await supabaseClient.from('study_trees').insert(flatList);
            }
        }

        // 拖曳功能
        let draggedNodeId = null;
        function handleDragStart(e, id) { e.stopPropagation(); draggedNodeId = id; }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDragEnter(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

        function handleDrop(e, targetId) {
            e.stopPropagation(); e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (draggedNodeId === null || draggedNodeId === targetId) return;

            const findNode = (nodes, id) => {
                for (const n of nodes) {
                    if (n.id === id) return n;
                    if (n.children) {
                        const found = findNode(n.children, id);
                        if (found) return found;
                    }
                }
                return null;
            };

            const draggedPreview = findNode(treeData, draggedNodeId);
            if (draggedPreview?.type === 'folder' && findNode(draggedPreview.children || [], targetId)) {
                draggedNodeId = null;
                return;
            }

            let draggedNode = removeNodeFromTree(treeData, draggedNodeId);
            if (!draggedNode) return;

            const insertIntoTarget = (nodes) => {
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].id === targetId) {
                        if (nodes[i].type === 'folder') {
                            if (!nodes[i].children) nodes[i].children = [];
                            nodes[i].children.push(draggedNode);
                            nodes[i].isOpen = true;
                        } else {
                            nodes.splice(i + 1, 0, draggedNode);
                        }
                        return true;
                    }
                    if (nodes[i].children && insertIntoTarget(nodes[i].children)) return true;
                }
                return false;
            };

            if (!insertIntoTarget(treeData)) treeData.push(draggedNode);
            draggedNodeId = null;
            saveAndRenderTree();
        }

        function removeNodeFromTree(nodes, id) {
            for (let i = 0; i < nodes.length; i++) {
                if (nodes[i].id === id) return nodes.splice(i, 1)[0];
                if (nodes[i].children) {
                    let found = removeNodeFromTree(nodes[i].children, id);
                    if (found) return found;
                }
            }
            return null;
        }

                wrapper.addEventListener('dragleave', handleDragLeave);

                if (node.type === "folder") {
                    const isRoot = depth === 0;
                    wrapper.innerHTML = `

                    `;
                } else if (node.type === "drawing") {
                    wrapper.innerHTML = `
                        <div class="flex items-center justify-between p-2 rounded-xl hover:bg-indigo-50/60 border border-transparent hover:border-indigo-200/80 transition-all">

                    `;
                } else {
                    wrapper.innerHTML = `

        function toggleNode(id) {
            const findAndToggle = (nodes) => {
                nodes.forEach(n => {
                    if (n.id === id) n.isOpen = !n.isOpen;
                    else if (n.children) findAndToggle(n.children);
                });
            };
            findAndToggle(treeData);
            saveAndRenderTree();
        }

        async function addChild(parentId, type) {
            let title = type === 'folder' ? "新增子資料夾名稱" : type === 'textfile' ? "新增文字筆記名稱" : type === 'drawing' ? "新增手繪圖解名稱" : "新增複習項目名稱";
            let name = await showCustomPrompt(title, "請輸入...");
            if (!name) return;
            
            const findAndAdd = (nodes) => {
                nodes.forEach(n => {
                    if (n.id === parentId) {
                        if (!n.children) n.children = [];
                        n.children.push({ 
                            id: Date.now(), 
                            name, 
                            type, 
                            isOpen: false, 
                            children: [], 
                            done: false, 
                            content: type === 'textfile' ? '# 筆記內容\n' : (type === 'drawing' ? '' : undefined) 
                        });
                        n.isOpen = true;
                    } else if (n.children) findAndAdd(n.children);
                });
            };
            findAndAdd(treeData);
            saveAndRenderTree();
        }

        async function deleteNode(id) {
            const ok = await showConfirm('刪除這個項目？', '如果這是資料夾，其中的內容也可能一起被移除。請確認你真的要繼續。', true);
            if (!ok) return;
            const findAndDelete = (nodes) => {
                let index = nodes.findIndex(n => n.id === id);
                if (index > -1) { nodes.splice(index, 1); return true; }
                for (let n of nodes) {
                    if (n.children && findAndDelete(n.children)) return true;
                }
                return false;
            };
            findAndDelete(treeData);
            saveAndRenderTree();
        }

        function toggleItem(id) {
            const findAndToggle = (nodes) => {
                nodes.forEach(n => {
                    if (n.id === id) n.done = !n.done;
                    else if (n.children) findAndToggle(n.children);
                });
            };
            findAndToggle(treeData);
            saveAndRenderTree();
        }

                setTimeout(() => {
                    initCanvas();
                    if (targetDrawing.content) {
                        const img = new Image();
                        img.onload = () => {
                            const dpr = Math.max(1, window.devicePixelRatio || 1);
                            ctx.save();
                            ctx.setTransform(1, 0, 0, 1, 0, 0);
                            ctx.globalCompositeOperation = 'source-over';
                            ctx.globalAlpha = 1;
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.restore();

                            ctx.save();
                            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                            ctx.globalCompositeOperation = 'source-over';
                            ctx.globalAlpha = 1;
                            ctx.drawImage(img, 0, 0, baseCanvasWidth, baseCanvasHeight);
                            ctx.restore();

                            applyToolStyle();
                            panX = 0;
                            panY = 0;
                            canvasZoom = 1;
                            applyCanvasTransform();
                            history = [];
                            historyIndex = -1;
                            saveCanvasState();
                        };
                        img.src = targetDrawing.content;
                    } else {
                        clearCanvas();
                    }
                }, 50);
            }
        }

        function loadUserQuiz() {
            const qContainer = document.getElementById('quiz-question');
            const optContainer = document.getElementById('quiz-options');
            const feedback = document.getElementById('quiz-feedback');
            const badge = document.getElementById('quiz-type-badge');
            feedback.classList.add('hidden');

            if (cards.length === 0) {
                qContainer.innerText = "目前題庫尚無題目，請在下方新增錯題！";
                optContainer.innerHTML = '';
                badge.innerText = "等待題庫";
                return;
            }

            const randomCard = cards[Math.floor(Math.random() * cards.length)];
            qContainer.innerText = `[${randomCard.subject}] ${randomCard.question}`;
            optContainer.innerHTML = '';

            const cleanAns = (randomCard.answer || '').replace(/[^A-Ea-e]/g, '').toUpperCase();
            const isMultipleChoice = cleanAns.length > 1;
            badge.innerText = isMultipleChoice ? "多選題" : "單選題";

            let hasOptions = false;
            if (randomCard.options && typeof randomCard.options === 'object') {
                ['A', 'B', 'C', 'D', 'E'].forEach(key => {
                    if (randomCard.options[key]) {
                        hasOptions = true;
                        const btn = document.createElement('button');
                        if (isMultipleChoice) {
                            btn.className = 'quiz-opt-btn w-full text-left text-xs bg-white/10 hover:bg-white/25 text-indigo-50 p-2.5 rounded-xl transition-all font-medium border border-white/15 flex items-center justify-between';
                            btn.dataset.key = key;
                            btn.innerHTML = `<span>(${key}) ${randomCard.options[key]}</span><span class="opt-check text-indigo-200 font-bold bg-white/10 w-5 h-5 rounded flex items-center justify-center">○</span>`;
                            btn.onclick = () => {
                                const checkSpan = btn.querySelector('.opt-check');
                                if (checkSpan.innerText === '○') {
                                    checkSpan.innerText = '✓';
                                    checkSpan.className = 'opt-check text-slate-900 font-bold bg-amber-300 w-5 h-5 rounded flex items-center justify-center';
                                } else {
                                    checkSpan.innerText = '○';
                                    checkSpan.className = 'opt-check text-indigo-200 font-bold bg-white/10 w-5 h-5 rounded flex items-center justify-center';
                                }
                            };
                        } else {
                            btn.className = 'w-full text-left text-xs bg-white/10 hover:bg-white/25 text-indigo-50 p-2.5 rounded-xl transition-all font-medium border border-white/15';
                            btn.innerText = `(${key}) ${randomCard.options[key]}`;
                            btn.onclick = () => checkQuizAnswer(key, randomCard.answer, randomCard.solution, false, false);
                        }
                        optContainer.appendChild(btn);
                    }
                });

                if (isMultipleChoice && hasOptions) {
                    const submitBtn = document.createElement('button');
                    submitBtn.className = 'w-full mt-2 bg-white hover:bg-indigo-50 text-indigo-700 text-xs font-bold py-2.5 rounded-xl transition shadow';
                    submitBtn.innerText = "🚀 送出多選答案";
                    submitBtn.onclick = () => {
                        let selectedKeys = [];
                        document.querySelectorAll('.quiz-opt-btn').forEach(b => {
                            if (b.querySelector('.opt-check').innerText === '✓') selectedKeys.push(b.dataset.key);
                        });
                        checkQuizAnswer(selectedKeys.join(''), randomCard.answer, randomCard.solution, true, false);
                    };
                    optContainer.appendChild(submitBtn);
                }
            }

            if (!hasOptions) {
                badge.innerText = "簡答題";
                optContainer.innerHTML = `<p class="text-xs text-indigo-200">此題為簡答題，請點擊下方查看解析。</p>`;
                const btn = document.createElement('button');
                btn.className = 'w-full text-xs bg-white text-indigo-700 p-2.5 rounded-xl font-bold mt-1 shadow';
                btn.innerText = "💡 查看答案與解析";
                btn.onclick = () => checkQuizAnswer('', randomCard.answer, randomCard.solution, false, true);
                optContainer.appendChild(btn);
            }
        }

        function checkQuizAnswer(selectedAnswer, correctAnswer, solution, isMultiple = false, isNonChoice = false) {
            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');
            const correct = (correctAnswer || '').replace(/[^A-Ea-e]/g, '').toUpperCase().split('').sort().join('');
            const selected = (selectedAnswer || '').replace(/[^A-Ea-e]/g, '').toUpperCase().split('').sort().join('');

            if (isNonChoice) {
                feedback.className = "text-xs font-bold text-white mt-2.5 p-3 rounded-2xl bg-white/20 border border-white/30 backdrop-blur-md space-y-1";
                feedback.innerHTML = `📌 <strong>答案：</strong> ${correctAnswer}<br>💡 <strong>解析：</strong> ${solution || '無'}`;
                return;
            }

            if (selected === correct) {
                feedback.className = "text-xs font-bold text-emerald-100 mt-2.5 p-3 rounded-2xl bg-emerald-600/50 border border-emerald-400 space-y-1";
                feedback.innerHTML = `🎉 <strong>答對了！</strong> (${correctAnswer})<br>💡 <strong>解析：</strong> ${solution || '無'}`;
            } else {
                feedback.className = "text-xs font-bold text-rose-100 mt-2.5 p-3 rounded-2xl bg-rose-600/50 border border-rose-400 space-y-1";
                feedback.innerHTML = `❌ <strong>答錯囉！</strong> 正確答案是 <strong>(${correctAnswer})</strong><br>💡 <strong>解析：</strong> ${solution || '無'}`;
            }
        }


        function escapeHTML(value = '') {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[ch]));
        }

        // --- 便條紙題庫 CRUD ---
        async function fetchCards() {
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                cards = JSON.parse(localStorage.getItem('study_notes_cards')) || [];
                updateUI();
                return;
            }

            const { data, error } = await supabaseClient.from('study_cards').select('*').order('created_at', { ascending: false });
            if (!error) {
                cards = data || [];
                updateUI();
            }
        }

        function updateUI() {
            renderSubjectFilters();
            renderCards();
            loadUserQuiz();
        }

        let currentTypeFilter = '全部';
        let currentChapterFilter = '全部';

        function getQuestionType(card) {
            const ans = (card.answer || '').replace(/[^A-Ea-e]/g, '').toUpperCase();
            if (!card.options || Object.keys(card.options).filter(k => card.options[k]).length === 0) return '簡答題';
            return ans.length > 1 ? '多選題' : '單選題';
        }

        function getChapter(card) {
            return (card.title || '未分類').trim() || '未分類';
        }

        function renderSubjectFilters() {
            const filterContainer = document.getElementById('subject-filters');
            const subjects = ['全部', ...new Set(cards.map(c => c.subject).filter(Boolean))];
            const chapters = [...new Set(cards.map(getChapter))].sort();
            const types = ['全部', '單選題', '多選題', '簡答題'];

            filterContainer.innerHTML = `
                <div class="category-toolbar w-full rounded-2xl p-2.5 sm:p-3 space-y-2.5">
                    <div class="flex items-center gap-2 overflow-x-auto pb-0.5">
                        <span class="text-[10px] font-extrabold text-slate-400 shrink-0">科目</span>
                        <div id="subject-filter-row" class="flex gap-1.5"></div>
                    </div>
                    <div class="flex items-center gap-2 overflow-x-auto pb-0.5">
                        <span class="text-[10px] font-extrabold text-slate-400 shrink-0">題型</span>
                        <div id="type-filter-row" class="flex gap-1.5"></div>
                    </div>
                    <div class="flex items-center gap-2 overflow-x-auto pb-0.5">
                        <span class="text-[10px] font-extrabold text-slate-400 shrink-0">章節</span>
                        <div id="chapter-filter-row" class="flex gap-1.5"></div>
                    </div>
                </div>
            `;

            const addButtons = (containerId, values, current, handler) => {
                const row = document.getElementById(containerId);
                values.forEach(value => {
                    const btn = document.createElement('button');
                    btn.className = `category-filter px-3 py-1.5 text-[11px] font-bold rounded-xl shrink-0 ${current === value ? 'active' : ''}`;
                    btn.textContent = value;
                    btn.onclick = () => handler(value);
                    row.appendChild(btn);
                });
            };

            addButtons('subject-filter-row', subjects, currentFilter, filterSubject);
            addButtons('type-filter-row', types, currentTypeFilter, filterType);

            const chapterValues = ['全部', ...chapters];
            addButtons('chapter-filter-row', chapterValues, currentChapterFilter, filterChapter);
        }

        function filterSubject(sub) {
            currentFilter = sub;
            renderSubjectFilters();
            renderCards();
        }

        function filterType(type) {
            currentTypeFilter = type;
            renderSubjectFilters();
            renderCards();
        }

        function filterChapter(chapter) {
            currentChapterFilter = chapter;
            renderSubjectFilters();
            renderCards();
        }

                async function saveCard() {
            const editingId = document.getElementById('editing-id').value;
            const subject = document.getElementById('card-subject').value.trim();
            const question = document.getElementById('card-question').value.trim();
            
            if (!subject || !question) {
                await showDialog({
                    title: '還少一點資料',
                    message: '請先填寫「科目」與「題目內容」，才能把題目加入題庫。',
                    icon: '📝',
                    confirmText: '知道了'
                });
                return;
            }

            const cardData = {
                subject: subject,
                title: document.getElementById('card-title').value.trim() || '精選試題',
                question: question,
                options: {
                    A: document.getElementById('opt-a').value.trim(),
                    B: document.getElementById('opt-b').value.trim(),
                    C: document.getElementById('opt-c').value.trim(),
                    D: document.getElementById('opt-d').value.trim(),
                    E: document.getElementById('opt-e').value.trim()
                },
                answer: document.getElementById('card-answer').value.trim(),
                solution: document.getElementById('card-solution').value.trim()
            };

            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                if (editingId) {
                    cards = cards.map(c => c.id == editingId ? { ...c, ...cardData } : c);
                } else {
                    cardData.id = Date.now();
                    cards.unshift(cardData);
                }
                localStorage.setItem('study_notes_cards', JSON.stringify(cards));
                updateUI();
                resetForm();
            } else {
                if (editingId) {
                    await supabaseClient.from('study_cards').update(cardData).eq('id', editingId);
                } else {
                    cardData.id = Date.now();
                    await supabaseClient.from('study_cards').insert([cardData]);
                }
                fetchCards();
                resetForm();
            }
        }

        function editCard(id) {
            const card = cards.find(c => c.id == id);
            if (!card) return;

            document.getElementById('editing-id').value = card.id;
            document.getElementById('card-subject').value = card.subject || '';
            document.getElementById('card-title').value = card.title || '';
            document.getElementById('card-question').value = card.question || '';
            document.getElementById('card-answer').value = card.answer || '';
            document.getElementById('card-solution').value = card.solution || '';

            if (card.options && typeof card.options === 'object') {
                document.getElementById('opt-a').value = card.options.A || '';
                document.getElementById('opt-b').value = card.options.B || '';
                document.getElementById('opt-c').value = card.options.C || '';
                document.getElementById('opt-d').value = card.options.D || '';
                document.getElementById('opt-e').value = card.options.E || '';
            }

            document.getElementById('submit-btn').innerHTML = "<span>💾</span> 儲存修改";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function cancelEdit() { resetForm(); }

        function resetForm() {
            document.getElementById('editing-id').value = '';
            document.getElementById('card-subject').value = '';
            document.getElementById('card-title').value = '';
            document.getElementById('card-question').value = '';
            document.getElementById('opt-a').value = '';
            document.getElementById('opt-b').value = '';
            document.getElementById('opt-c').value = '';
            document.getElementById('opt-d').value = '';
            document.getElementById('opt-e').value = '';
            document.getElementById('card-answer').value = '';
            document.getElementById('card-solution').value = '';
            document.getElementById('submit-btn').innerHTML = "<span>✨</span> 將題目加入便條紙題庫";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        async function deleteCard(id) {
            const ok = await showConfirm('刪除這道題目？', '刪除後將無法在目前的題庫中找到這道題目。這個操作無法復原。', true);
            if (!ok) return;
            if (!supabaseClient || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                cards = cards.filter(c => c.id != id);
                localStorage.setItem('study_notes_cards', JSON.stringify(cards));
                updateUI();
            } else {
                await supabaseClient.from('study_cards').delete().eq('id', id);
                fetchCards();
            }
        }

        function renderCards() {
            const wall = document.getElementById('card-wall');
            wall.innerHTML = '';
            const filteredCards = cards.filter(c =>
                (currentFilter === '全部' || c.subject === currentFilter) &&
                (currentTypeFilter === '全部' || getQuestionType(c) === currentTypeFilter) &&
                (currentChapterFilter === '全部' || getChapter(c) === currentChapterFilter)
            );

            if (filteredCards.length === 0) {
                wall.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-10">目前尚無題目資料！</p>`;
                return;
            }

            filteredCards.forEach(c => {
                let optionsHtml = '';
                if (c.options && typeof c.options === 'object') {
                    let optList = '';
                    ['A', 'B', 'C', 'D', 'E'].forEach(key => {
                        if (c.options[key]) {
                            optList += `<div class="text-xs font-mono text-slate-700 py-0.5 flex items-start"><span class="font-bold text-slate-400 mr-2 bg-slate-100 px-1.5 py-0.5 rounded">(${key})</span><span class="mt-0.5">${escapeHTML(c.options[key])}</span></div>`;
                        }
                    });
                    if (optList) optionsHtml = `<div class="mb-3 bg-slate-50 p-3 rounded-2xl border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Options</p>${optList}</div>`;
                }

                const div = document.createElement('div');
                div.className = "exam-note p-5 sm:p-6 rounded-3xl relative flex flex-col justify-between";
                div.innerHTML = `
                    <div>
                        <div class="question-card-actions absolute top-4 right-4 flex items-center gap-1">
                            <button onclick="editCard('${c.id}')" title="編輯題目" class="text-xs bg-white/90 hover:bg-indigo-50 text-slate-600 hover:text-indigo-700 px-2.5 py-1.5 rounded-xl font-bold border border-slate-200 shadow-sm">✎</button>
                            <button onclick="deleteCard('${c.id}')" title="刪除題目" class="text-xs bg-white/90 hover:bg-rose-50 text-rose-500 hover:text-rose-700 px-2.5 py-1.5 rounded-xl font-bold border border-slate-200 shadow-sm">⌫</button>
                        </div>
                        <div class="flex items-center flex-wrap gap-1.5 mb-3 pr-20">
                            <span class="text-[10px] font-extrabold bg-slate-900 text-white px-2.5 py-1 rounded-xl">${escapeHTML(c.subject)}</span>
                            <span class="question-type-badge bg-indigo-50 text-indigo-700 border border-indigo-100">${getQuestionType(c)}</span>
                            <span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-xl truncate max-w-[170px]"># ${escapeHTML(getChapter(c))}</span>
                        </div>
                        <div class="mb-3">
                            <p class="text-xs font-medium text-slate-800 whitespace-pre-wrap leading-relaxed">${escapeHTML(c.question)}</p>
                        </div>
                        ${optionsHtml}
                    </div>
                    <div class="mt-2 pt-3 border-t border-slate-100 space-y-2">
                        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <span class="text-[11px] font-bold text-slate-600">📌 答案：</span>
                            <span class="text-xs font-bold text-indigo-600 bg-white px-2.5 py-0.5 rounded-lg border">${escapeHTML(c.answer || '未設')}</span>
                        </div>
                        <div>
                            <p class="text-[11px] font-bold text-slate-600 mb-1">💡 解題解析：</p>
                            <p class="text-xs text-slate-600 whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-100">${escapeHTML(c.solution || '無解析')}</p>
                        </div>
                    </div>
                `;
                wall.appendChild(div);
            });
        }


        function setupRealtime() {
            if (!supabaseClient) return;

            supabaseClient
                .channel('study-notes-live')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'study_cards' }, () => fetchCards())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'study_trees' }, () => fetchTreeData())
                .subscribe();
        }

        window.onload = function() {
            fetchTreeData();
            fetchCards();
            setupRealtime();
        };
    </script>
</body>
